- type: entity
  parent:
  - BaseMob
  - MobDamageable
  - MobCombat
  - StripableInventoryBase
  id: SyntheticBody
  name: synthetic
  description: A fully synthetic body visually similar to a human's. Though not as dexterous as the real thing, it's better than nothing. Accepts MMIs and positronic brains.
  save: false
  components:
  - type: Sprite
    layers:
    - sprite: Rimworld/synthbody.rsi
      state: skin
    - map: [ "jumpsuit" ]
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "outerClothing" ]
    - map: [ "eyes" ]
      sprite: Rimworld/synthbody.rsi
      state: eyes
      shader: unshaded
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon:
          True: {visible: true}
          False: {visible: false}
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      80: 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FloorOcclusion
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [Touch, Ingestion]
    reactions:
    - reagents: [Water, SpaceCleaner]
      methods: [Touch]
      effects:
      - !type:WashCreamPieReaction
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Electrocution
    - TemporaryBlindness
    - Flashed
  - type: IdExaminable
  - type: Hands
  - type: Inventory
    templateId: human
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: ComplexInteraction
  - type: Internals
  - type: FloatingVisuals
  - type: Climbing
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: AnimationPlayer
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: SleepEmitSound
  - type: SSDIndicator
  - type: StandingState
  - type: Dna
  - type: MindContainer
    showExamineInfo: true
  - type: CanEnterCryostorage
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: CreamPied
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Puller
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MobPrice
    price: 1500 # Kidnapping a living person and selling them for cred is a good move.
    deathPenalty: 0.01 # However they really ought to be living and intact, otherwise they're worth 100x less.
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
  - type: Blindable
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 4.0
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: HealthExaminable
    examinableTypes:
      - Blunt
      - Slash
      - Piercing
      - Heat
      - Shock
    locPrefix: silicon
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Common
  - type: ActiveRadio
    channels:
    - Binary
    - Common
  - type: ZombieImmune
  - type: Repairable
    doAfterDelay: 10
    allowSelfRepair: true
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBorg
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: UnblockableSpeech
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Slash: 2
        Heat: 5
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Body
    prototype: Synthetic

- type: body
  id: Synthetic
  name: synthetic
  root: torso
  slots:
    torso:
      part: TorsoHuman
      connections:
      - right_arm
      - left_arm
    right_arm:
      part: RightArmHuman
      connections:
      - right_hand
    left_arm:
      part: LeftArmHuman
      connections:
      - left_hand
    right_hand:
      part: RightHandHuman
    left_hand:
      part: LeftHandHuman

- type: constructionGraph
  id: SyntheticBody
  start: frame
  graph:
  - node: frame
    entity: SyntheticEndoskeleton
    edges:
    - to: wired
      steps:
      - material: Cable
        amount: 4
        doAfter: 2
      - tag: CapacitorStockPart
        name: capacitor
        icon:
          sprite: Objects/Misc/stock_parts.rsi
          state: capacitor
        doAfter: 0.5
      - tag: MicroManipulatorStockPart
        name: micro_mani
        icon:
          sprite: Objects/Misc/stock_parts.rsi
          state: capacitor
        doAfter: 0.5
      - tag: MicroManipulatorStockPart
        name: micro_mani
        icon:
          sprite: Objects/Misc/stock_parts.rsi
          state: capacitor
        doAfter: 0.5
      - material: SyntheticMuscle
        amount: 8
        doAfter: 4
      - tool: Screwing
        doAfter: 3

  - node: wired
    entity: SyntheticEndoskeleton
    edges:
    - to: finish
      steps:
      - material: Plastic
        amount: 6
        doAfter: 2.5
      - material: Steel
        amount: 3
        doAfter: 2
      - tool: Screwing
        doAfter: 1
      - tool: Welding
        doAfter: 3
      completed:
      - !type:SpawnPrototype
        prototype: SyntheticBody
      - !type:DeleteEntity

  - node: finish

- type: entity
  id: SyntheticEndoskeleton
  name: synthetic body endoskeleton
  description: A tightly machined endoskeleton used to construct synthetic bodies. Spooky.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    noRot: true
    drawdepth: Items
    sprite: Rimworld/synthbody.rsi
    state: endo_frame
  - type: Appearance
  - type: Construction
    graph: SyntheticBody
    node: frame
    defaultTarget: finish