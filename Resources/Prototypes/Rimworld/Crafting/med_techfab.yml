- type: entity
  id: MedicalTechFab
  parent: BaseLatheLube
  name: medical techfab
  description: Prints equipment for use by the medbay.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: med
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticRecipes:
      - Brutepack
      - Ointment
      - Gauze
      - HandLabeler
      - Defibrillator
      - HandheldHealthAnalyzer
      - ClothingHandsGlovesLatex
      - ClothingHandsGlovesNitrile
      - ClothingMaskSterile
      - DiseaseSwab
      - Beaker
      - LargeBeaker
      - Dropper
      - Jug
      - Syringe
      - Implanter
      - PillCanister
      - BodyBag
      - ChemistryEmptyBottle01
      - RollerBedSpawnFolded
      - CheapRollerBedSpawnFolded
      - EmergencyRollerBedSpawnFolded
      - Medkit
      - MedkitBurn
      - MedkitToxin
      - MedkitO2
      - MedkitBrute
      - MedkitAdvanced
      - MedkitRadiation
      - MedkitCombat
      - Scalpel
      - Retractor
      - Cautery
      - Drill
      - Saw
      - Hemostat
      - ClothingEyesGlassesChemical
      - WhiteCane
    dynamicRecipes:
      - ChemicalPayload
      - CryostasisBeaker
      - BluespaceBeaker
      - SyringeBluespace
      - SyringeCryostasis
  - type: Machine
    board: MedicalTechFabCircuitboard
  - type: StealTarget
    stealGroup: MedicalTechFabCircuitboard