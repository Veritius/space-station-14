- type: entity
  id: WallRockBasaltInvulnerable
  name: dense basalt
  description: Ultra-dense basalt, compacted by thousands of years of pressure. You don't have a hope of getting through this stuff.
  suffix: Invulnerable
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Tag
    tags:
    - Wall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 12000
  - type: Occluder
  - type: Airtight
  - type: RadiationBlocker
    resistance: 99999
  - type: BlockWeather
  - type: Clickable
  - type: PlacementReplacement
    key: walls
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_wall
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    drawdepth: Walls
    layers:
    - state: rock_wall
    - map: [ "enum.EdgeLayer.South" ]
      state: rock_wall_south
    - map: [ "enum.EdgeLayer.East" ]
      state: rock_wall_east
    - map: [ "enum.EdgeLayer.North" ]
      state: rock_wall_north
    - map: [ "enum.EdgeLayer.West" ]
      state: rock_wall_west