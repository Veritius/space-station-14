- type: entity
  parent: BasePowerCell
  id: PowerCellCorruptSilicon
  name: corrupted power cell
  description: A power cell in the standard Nanotrasen form factor, salvaged from a destroyed corrupted silicon.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: small
      color: "#b8ea23"
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 80
  - type: DetailExaminable
    content: It's covered in a thin film of iridescent slime. Tiny crevices in the shell of the cell glow with a brilliant, pulsating white light. It smells awful, like a combination of burning rubber and chemical waste.

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCorruptSilicon
  name: corrupt encryption key
  description: An power cell in the standard Nanotrasen form factor, salvaged from a destroyed corrupted silicon.
  components:
  - type: EncryptionKey
    channels:
    - CorruptSilicon
    defaultChannel: CorruptSilicon
  - type: Sprite
    layers:
    - state: crypt_rusted
    - state: ai_label
  - type: DetailExaminable
    content: It's covered in a thin film of iridescent slime. The casing is rusted, and in places replaced with an unidentifable black metal. The electrical contacts seem to be in working order.

- type: entity
  parent: [ CorruptSiliconBeamGun ]
  id: CorruptSiliconBeamGunDropped
  description: A massive heavy rifle with innumerable strange protrusions and glowing doodads.
  suffix: Dropped
  components:
  - type: Wieldable
  - type: GunRequiresWield

- type: entity
  parent: [ CorruptSiliconRailGun ]
  id: CorruptSiliconRailGunDropped
  description: A massive heavy rifle with innumerable strange protrusions and spinning gizmos.
  suffix: Dropped
  components:
  - type: Wieldable
  - type: GunRequiresWield