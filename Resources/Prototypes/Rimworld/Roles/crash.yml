  id: EventRoleHumanCrashedEngineer
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    roleLoadout: [ JobStationEngineer ]

- type: entity
