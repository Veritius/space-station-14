- type: entity
  parent: MarkerBase
  id: CrashSiteCargoSpawnerAll
  name: ship cargo spawner
  suffix: Everything
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Storage/Crates/generic.rsi
        state: icon
  - type: RandomSpawner
    chance: 0.2
    prototypes:
    # security gear
    - CrateArmoryLaser
    - CrateArmoryPistols
    - CrateTrackingImplants
    - CrateSecurityHelmet
    - CrateSecurityArmor
    # medical gear
    - CrateMedicalSupplies
    - CrateEmergencyBurnKit
    - CrateEmergencyBruteKit
    - CrateEmergencyToxinKit
    - CrateEmergencyO2Kit
    # engie gear
    - CrateEngineeringCableBulk
    - CrateEngineering
    # service gear
    - CrateFoodPizza
    - CrateFoodMRE
    - CrateFoodCooking
    - CrateFoodBarSupply
    - CrateFoodSoftdrinks
    - CrateServiceJanitorialSupplies
    - CrateServiceBureaucracy
    # materials
    - CrateMaterialSteel
    - CrateMaterialGlass
    - CrateMaterialPlastic
    - CrateMaterialWood
    - CrateMaterialTextiles
    rareChance: 0.1
    rarePrototypes:
    # security gear
    - CrateArmoryShotgun
    - CrateArmorySMG
    - CrateSecurityRiot
    - CrateSecurityNonlethal
    # medical gear
    - CrateEmergencyAdvancedKit
    # service gear
    - CrateFoodPizzaLarge
    - CrateFoodSoftdrinksLarge
    - CrateHydroponicsSeedsMedicinal
    - CrateHydroponicsSeedsExotic
    # materials
    - CrateMaterialPlasteel
    - CrateMaterialPlasma

