- type: entity
  parent: BaseMobEventXeno
  id: MobEventXenoDrone
  name: drone
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/drone.rsi
    offset: 0,0.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      160: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      120: 0.7
  - type: MeleeWeapon
    damage:
      types:
        Brute: 6
  - type: MovementSpeedModifier
    baseSprintSpeed: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GhostRole
    name: xeno drone
    description: A worker of the xeno hive.

- type: entity
  parent: BaseMobEventXeno
  id: MobEventXenoPraetorian
  name: praetorian
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/praetorian.rsi
    offset: 0,0.4
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      360: Dead
  - type: Stamina
    critThreshold: 300
  - type: SlowOnDamage
    speedModifierThresholds:
      300: 0.7
  - type: MeleeWeapon
    damage:
      types:
        Brute: 8
        Slash: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GhostRole
    name: xeno praetorian
    description: A lesser fighter-caste member of the xeno hive.