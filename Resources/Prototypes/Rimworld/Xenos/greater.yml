- type: entity
  parent: BaseMobEventXeno
  id: MobEventXenoRunner
  name: runner
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/runner.rsi
    offset: 0,0.6
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      240: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.9
      160: 0.7
      200: 0.5
  - type: MeleeWeapon
    damage:
      types:
        Slash: 9
  - type: MovementSpeedModifier
    baseSprintSpeed: 7.0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 235
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GhostRole
    name: xeno ravager
    description: A specialised scout of the xeno hive. Fragile but extremely fast.
    raffle:
      settings: default

- type: entity
  parent: BaseMobEventXeno
  id: MobEventXenoRavager
  name: ravager
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/ravager.rsi
    offset: 0,0.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      550: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      500: 0.7
  - type: MeleeWeapon
    damage:
      types:
        Slash: 16
        Piercing: 2
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 400
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: GhostRole
    name: xeno ravager
    description: A specialised hunter-killer of the xeno hive. Tough and hard-hitting.
    raffle:
      settings: default

- type: entity
  parent: BaseMobEventXeno
  id: MobEventXenoSpitter
  name: spitter
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/spitter.rsi
    offset: 0,0.6
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.9
      100: 0.7
      130: 0.5
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
  - type: MovementSpeedModifier
    baseSprintSpeed: 4.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.6
  - type: BasicEntityAmmoProvider
    proto: BulletAcidStrong
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.75
    useKey: false
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg
  - type: GhostRole
    name: xeno ravager
    description: A specialised fighter-caste member of the xeno hive. Very fragile, but capable of ranged attacks.
    raffle:
      settings: default