- type: reaction
  id: Yayo
  impact: Low
  quantized: true
  reactants:
    Desoxyephedrine:
      amount: 1
    Water:
      amount: 1
  effects:
    - !type:CreateEntityReactionEffect
      entity: MaterialYayo1

- type: stack
  id: Yayo
  name: yayo
  icon: { sprite: /Textures/Objects/Materials/materials.rsi, state: cotton }
