- type: entity
  parent: PinpointerBase
  id: MacguffinPinpointer
  name: component pinpointer
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: pinpointer-crew
      map: ["enum.PinpointerLayers.Base"]

- type: entity
  parent: MacguffinPinpointer
  id: MacguffinPinpointerProcessor
  description: A pinpointer tuned to a component necessary to escape the planet. This one points to the processor component.
  suffix: Processor, Essential
  components:
  - type: Pinpointer
    targetName: quantum processor

- type: entity
  parent: MacguffinPinpointer
  id: MacguffinPinpointerTransport
  description: A pinpointer tuned to a component necessary to escape the planet. This one points to the transportation component.
  suffix: Transport, Essential
  components:
  - type: Pinpointer
    targetName: calabi-yau wormhole core

- type: entity
  parent: MacguffinPinpointer
  id: MacguffinPinpointerPower
  description: A pinpointer tuned to a component necessary to escape the planet. This one points to the energy source component.
  suffix: Power, Essential
  components:
  - type: Pinpointer
    targetName: zero-point energy cell

- type: entity
  parent: MacguffinPinpointer
  id: MacguffinPinpointerData
  description: A pinpointer tuned to a component useful in escaping the planet. This one points to a map of subspace. It's not necessary to escape.
  suffix: Data, Optional
  components:
  - type: Pinpointer
    targetName: subspace map data